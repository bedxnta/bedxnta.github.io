<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Write, preview, and save Markdown in MarkPlane's private, in-browser editor." />
    <meta name="theme-color" content="#f8fafc" />
    <title>Editor — MarkPlane</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      try {
        const savedTheme = localStorage.getItem("markplane-theme");
        document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body class="editor-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="MarkPlane home">
        <span class="brand-mark" aria-hidden="true"><span>M</span><i></i></span>
        <span>MarkPlane</span>
      </a>
      <div class="header-actions">
        <a class="header-cta" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <main>
      <section class="editor-section editor-page-shell" id="editor">
        <div class="section-top">
          <div class="editor-actions">
            <button class="secondary-button" id="sample-button" type="button" title="Load a Markdown example">Load example</button>
            <button class="secondary-button" id="copy-button" type="button">Copy Markdown</button>
            <button class="primary-button download-button" id="download-button" type="button">Download .md <span aria-hidden="true">↓</span></button>
          </div>
        </div>

        <div class="workspace">
          <div class="workspace-topbar">
            <label class="document-name-wrap">
              <span class="visually-hidden">Document name</span>
              <input id="document-name" type="text" value="Untitled" maxlength="80" aria-label="Document name" />
              <span class="file-extension">.md</span>
            </label>
            <div class="save-state"><span class="save-dot" id="save-dot"></span><span id="save-status" role="status" aria-live="polite">Saved on this device</span></div>
          </div>
          <div class="toolbar" role="toolbar" aria-label="Markdown formatting">
            <button type="button" data-action="bold" aria-label="Bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
            <button type="button" data-action="italic" aria-label="Italic" title="Italic (Ctrl+I)"><em>I</em></button>
            <span class="toolbar-divider"></span>
            <button type="button" data-action="heading" aria-label="Heading" title="Heading">H</button>
            <button type="button" data-action="quote" aria-label="Quote" title="Quote">❞</button>
            <button type="button" data-action="ul" aria-label="Bulleted list" title="Bulleted list">☷</button>
            <button type="button" data-action="ol" aria-label="Numbered list" title="Numbered list">1.</button>
            <span class="toolbar-divider"></span>
            <button type="button" data-action="link" aria-label="Link" title="Insert link">↗</button>
            <button type="button" data-action="code" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
          </div>
          <div class="editor-grid">
            <section class="editor-pane" aria-labelledby="write-label">
              <div class="pane-heading"><span id="write-label">WRITE</span><span>Markdown</span></div>
              <textarea id="markdown-input" spellcheck="false" aria-label="Write Markdown" placeholder="Start writing your Markdown here..."></textarea>
            </section>
            <section class="preview-pane" aria-labelledby="preview-label">
              <div class="pane-heading"><span id="preview-label">PREVIEW</span><span>Live</span></div>
              <article class="markdown-preview" id="markdown-preview" aria-live="polite"></article>
            </section>
          </div>
          <div class="workspace-footer">
            <span id="document-stats">0 words · 0 characters</span>
            <span><kbd>Ctrl</kbd> + <kbd>S</kbd> to save locally</span>
          </div>
        </div>
        <p class="editor-footnote"><span aria-hidden="true">🔒</span> Your document is stored locally in this browser. It is never uploaded.</p>
      </section>
    </main>
  </body>
</html>
