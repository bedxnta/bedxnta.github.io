<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Paperplane Geometry -->
  <g filter="url(#shadow)">
    <!-- Main Plane Body -->
    <path d="M400 96 205 392l-38-140-125-64L400 96Z" fill="#ffffff"/>
    <!-- Fold Shading / Wing crease -->
    <path d="M167 252 298 136" stroke="#2563eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M167 252 205 392 245 285" fill="#e2e8f0" opacity="0.9"/>
  </g>

  <!-- Digital Pixel Blocks -->
  <rect x="336" y="320" width="72" height="72" rx="18" fill="#10b981"/>
  <rect x="240" y="352" width="56" height="56" rx="14" fill="#f59e0b"/>
  <rect x="368" y="240" width="48" height="48" rx="12" fill="#f43f5e"/>
</svg>
